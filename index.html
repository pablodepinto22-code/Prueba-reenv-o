<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piñatas Estrella · Arte y Diversión en cada Celebración</title>
<style>
:root {
  --bg: #0b0b0e; --surface: #17171f; --surface-2: #232330; --border: #38384f;
  --text: #f8fafc; --muted: #a1a1aa; --primary: #e11d48; --primary-h: #be123c;
  --accent: #fbbf24; --ok: #10b981;
  --glass: rgba(23,23,31,0.92); --shadow: 0 12px 35px -10px rgba(225,29,72,0.25);
  --radius: 18px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg);
  background-image: 
    radial-gradient(circle at 50% 15%, rgba(225,29,72,0.18) 0%, rgba(11,11,14,0.96) 65%),
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="450" height="450"><g opacity="0.08"><path d="M150,180 C130,120 180,60 250,60 C320,60 370,120 350,180 Z" fill="%23e11d48"/><circle cx="250" cy="120" r="45" fill="%23ffffff"/><path d="M220,100 Q250,80 280,100 Q310,130 280,160 Q250,140 220,160 Q190,130 220,100 Z" fill="%23ffffff"/><circle cx="235" cy="120" r="6" fill="%23dc2626"/><circle cx="265" cy="120" r="6" fill="%23dc2626"/><path d="M140,190 C90,190 70,240 90,280 C110,310 160,290 170,240 Z" fill="%231a1a1a"/><path d="M360,190 C410,190 430,240 410,280 C390,310 340,290 330,240 Z" fill="%231a1a1a"/><path d="M160,280 L340,280 L320,440 L180,440 Z" fill="%23dc2626"/></g></svg>');
  background-repeat: no-repeat;
  background-position: center 80px;
  color: var(--text); line-height: 1.6;
  min-height: 100vh; display: flex; flex-direction: column;
  background-attachment: fixed;
}
main { flex: 1; }
header {
  position: sticky; top: 0; z-index: 50; background: var(--glass);
  backdrop-filter: blur(14px); border-bottom: 2px solid #2a2a3d;
}
.nav {
  max-width: 1140px; margin: auto; padding: .9rem 20px;
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
}
.logo {
  font-weight: 900; font-size: 1.4rem; text-decoration: none; color: #fff;
  display: flex; align-items: center; gap: 10px; letter-spacing: .5px;
}
.logo span { color: var(--accent); text-shadow: 0 0 12px rgba(251,191,36,0.4); }
.nav-links { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.nav-link {
  color: var(--muted); text-decoration: none; font-size: .9rem; font-weight: 700;
  padding: 7px 14px; border-radius: 12px; transition: .2s;
}
.nav-link:hover { color: #fff; background: rgba(255,255,255,0.06); }
.nav-link.active { color: #fff; background: var(--primary); box-shadow: 0 4px 15px rgba(225,29,72,0.4); }
.nav-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
  padding: 7px 12px; border-radius: 12px; cursor: pointer; font-weight: 700;
  display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; transition: .2s;
}
.icon-btn:hover { border-color: var(--accent); transform: translateY(-1px); }

.view { display: none; animation: fadeIn .22s ease; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.route-bar {
  max-width: 1140px; margin: 18px auto 0; padding: 0 20px;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
}
.route-pill {
  font-size: .82rem; color: var(--accent); background: var(--surface);
  border: 1px solid var(--border); padding: 5px 14px; border-radius: 99px; font-weight: 700;
}

.hero {
  padding: 80px 20px 70px; text-align: center; position: relative;
  border-bottom: 2px solid var(--border);
}
.hero-badge {
  display: inline-block; background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3);
  padding: 6px 18px; border-radius: 99px; font-size: .88rem; font-weight: 800;
  color: var(--accent); margin-bottom: 16px; box-shadow: 0 0 20px rgba(251,191,36,0.15);
}
.hero h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight: 900; margin-bottom: 14px; letter-spacing: -.02em; color: #fff; }
.hero h1 span { color: var(--primary); text-shadow: 0 0 15px rgba(225,29,72,0.4); }
.hero p { color: var(--muted); max-width: 650px; margin: 0 auto 30px; font-size: 1.1rem; }
.hero-cta { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

.btn {
  background: var(--primary); color: #fff; border: none; padding: 12px 24px;
  border-radius: 14px; font-weight: 800; cursor: pointer; font-size: 1rem;
  text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .15s, background .2s, box-shadow .2s;
  box-shadow: 0 6px 20px rgba(225,29,72,0.35);
}
.btn:hover { background: var(--primary-h); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(225,29,72,0.5); }
.btn.sec { background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: var(--shadow); }
.btn.sec:hover { border-color: var(--accent); color: var(--accent); }

.stats-grid {
  max-width: 900px; margin: 42px auto 0; display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px;
}
.stat-card {
  background: var(--surface); border: 1px solid var(--border); padding: 20px;
  border-radius: var(--radius); box-shadow: var(--shadow); text-align: center;
}
.stat-card b { font-size: 1.7rem; display: block; color: var(--accent); margin-bottom: 4px; }
.stat-card span { font-size: .85rem; color: var(--muted); font-weight: 700; }

.container { max-width: 1140px; margin: auto; padding: 40px 20px 60px; }
.sec-head { text-align: center; margin-bottom: 35px; }
.sec-head h2 { font-size: 2.1rem; font-weight: 900; margin-bottom: 8px; color: #fff; }
.sec-head p { color: var(--muted); font-size: 1.05rem; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 26px; display: flex; flex-direction: column; justify-content: space-between;
  gap: 16px; box-shadow: var(--shadow); transition: transform .25s, border-color .25s; text-align: center;
}
.card:hover { transform: translateY(-5px); border-color: var(--accent); }
.emoji-box {
  font-size: 3rem; width: 75px; height: 75px; display: flex; align-items: center;
  justify-content: center; background: var(--surface-2); border-radius: 20px; border: 1px solid var(--border); margin: 0 auto;
}
.card h3 { font-size: 1.25rem; font-weight: 900; color: #fff; margin-top: 10px; }
.meta { font-size: .9rem; color: var(--muted); font-weight: 600; margin: 6px 0; }
.price { font-size: 1.5rem; font-weight: 900; color: var(--accent); margin: 10px 0; }

.split { display: grid; grid-template-columns: 1.1fr .9fr; gap: 28px; align-items: start; }
@media(max-width: 820px) { .split { grid-template-columns: 1fr; } }
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow);
}
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media(max-width: 560px) { .row { grid-template-columns: 1fr; } }
label { font-size: .9rem; font-weight: 800; display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; color: #e2e8f0; }

/* Corrección de fuentes en formularios y selectores */
input, select, textarea {
  width: 100%; padding: 12px 16px; background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 12px; font-size: 0.95rem; font-family: inherit;
  transition: border-color .2s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }

.est-box {
  background: linear-gradient(135deg, rgba(225,29,72,0.15), rgba(251,191,36,0.12));
  border: 2px solid var(--primary); border-radius: 16px; padding: 22px; text-align: center; margin: 18px 0;
  box-shadow: 0 0 25px rgba(225,29,72,0.15);
}
.est-box b { font-size: 2rem; color: var(--accent); display: block; margin: 6px 0; text-shadow: 0 0 10px rgba(251,191,36,0.3); }
.time-badge { display: inline-block; background: var(--surface); padding: 6px 14px; border-radius: 99px; font-size: .85rem; font-weight: 800; color: #fbbf24; border: 1px solid var(--border); margin-top: 10px; }

details {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px 20px; margin-bottom: 12px; box-shadow: var(--shadow);
}
summary { font-weight: 900; cursor: pointer; font-size: 1.05rem; color: #fff; }
details p { color: var(--muted); margin-top: 10px; font-size: .95rem; }

.toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 200;
  background: #fff; color: #000; padding: 14px 22px;
  border-radius: 14px; font-weight: 800; font-size: .95rem;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateY(120%); transition: transform .25s;
  border-left: 5px solid var(--accent);
}
.toast.show { transform: translateY(0); }

footer {
  text-align: center; padding: 32px 20px; border-top: 2px solid var(--border);
  color: var(--muted); font-size: .9rem; background: var(--surface); font-weight: 700;
}
footer span { color: var(--accent); }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
const DB = {
  brand: "Piñatas Estrella",
  web3Key: "a930a3b7-9ac0-4158-a681-6d89ae882949",
  routes: [
    { id: "inicio", label: "⭐ Inicio" },
    { id: "tamanos", label: "📏 Tamaños" },
    { id: "galeria", label: "✨ Piñatas Estrella" },
    { id: "personalizador", label: "🪄 Diseña tu Piñata" },
    { id: "contacto", label: "💌 Encargar / Pedido" },
    { id: "faq", label: "❓ Preguntas" }
  ],
  sizesData: [
    { name: "Pequeña", measure: "40 cm aprox.", desc: "Ideal para celebraciones íntimas o decoración infantil.", time: "2 semanas mínimo", priceRef: "Desde 35 €", emoji: "⭐" },
    { name: "Mediana", measure: "60 cm aprox.", desc: "Nuestro tamaño estrella para fiestas y cumpleaños estándar.", time: "2 a 3 semanas", priceRef: "Desde 50 €", emoji: "🎈" },
    { name: "Grande", measure: "80 cm aprox.", desc: "Gran presencia visual y alta capacidad interior para sorpresas.", time: "3 semanas", priceRef: "Desde 70 €", emoji: "🦄" },
    { name: "Muy Grande", measure: "100+ cm aprox.", desc: "Estructura imponente para grandes eventos y celebraciones.", time: "3 a 4 semanas", priceRef: "Desde 95 €", emoji: "🏰" }
  ],
  sizes: {
    "Pequeña (40 cm)": { mult: 0.8, time: "2 semanas mínimo" },
    "Mediana (60 cm)": { mult: 1.0, time: "2 a 3 semanas" },
    "Grande (80 cm)": { mult: 1.35, time: "3 semanas" },
    "Muy Grande (100+ cm)": { mult: 1.75, time: "3 a 4 semanas" }
  },
  types: [
    { id: "Tradicional", name: "Tradicional de Estrellas", baseP: 38, emoji: "⭐", desc: "Clásica de puntas festivas con flecos artesanales." },
    { id: "Tambor", name: "Tambor / Redonda", baseP: 45, emoji: "🥁", desc: "Resistente, ideal para rellenar con gran variedad de sorpresas." },
    { id: "Silueta", name: "Silueta Personalizada", baseP: 60, emoji: "🦄", desc: "Forma de personaje, número o temática especial a medida." },
    { id: "3D", name: "Estructura 3D / Volumen", baseP: 75, emoji: "🎈", desc: "Escultura tridimensional detallada de alta gama." }
  ],
  gallery: [
    { title: "Minnie Mouse Edición Especial", type: "Silueta", size: "Grande (80 cm)", imgDesc: "Inspirada en nuestro logotipo con lazo de lunares rojos y flecos negros.", emoji: "🎀" },
    { title: "Estrella Navideña 7 Puntas", type: "Tradicional", size: "Muy Grande (100+ cm)", imgDesc: "Diseño tradicional con colores metalizados y picos reforzados.", emoji: "🌟" },
    { title: "Unicornio Mágico Arcoíris", type: "3D", size: "Grande (80 cm)", imgDesc: "Melena multicolor de papel crepé y cuerno dorado brillante.", emoji: "🦄" }
  ],
  faqs: [
    { q: "¿Cuál es el tiempo mínimo de antelación?", a: "El tiempo mínimo de elaboración es de 2 semanas para garantizar un trabajo 100% artesanal y exclusivo." },
    { q: "¿Cómo se calculan los tiempos según el tamaño?", a: "Dependiendo de si eliges Pequeña, Mediana, Grande o Muy Grande, el tiempo oscila entre las 2 y 4 semanas." },
    { q: "¿Hacéis envíos o recogida local?", a: "Realizamos entrega en persona y puntos acordados. Al enviar tu solicitud por el formulario concretamos los detalles." }
  ]
};

const STATE = {
  route: "inicio"
};

const $ = id => document.getElementById(id);
const notify = msg => {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove("show"), 3000);
};

function syncRoute() {
  const raw = location.hash.replace(/^#\/?/, "").trim().toLowerCase();
  const valid = DB.routes.some(r => r.id === raw) ? raw : "inicio";
  STATE.route = valid;
  if (location.hash !== `#/${valid}`) history.replaceState(null, "", `#/${valid}`);

  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === `view-${valid}`));
  document.querySelectorAll(".nav-link").forEach(a => a.classList.toggle("active", a.dataset.route === valid));
  const currentObj = DB.routes.find(r => r.id === valid);
  $("route-label").textContent = `Estás en: ${currentObj.label} (${location.hash})`;
  document.title = `${currentObj.label.replace(/^[^\s]+\s/, "")} · ${DB.brand}`;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function initApp() {
  $("app").innerHTML = `
    <header><div class="nav">
      <a href="#/inicio" class="logo">⭐ Piñatas <span>Estrella</span></a>
      <nav class="nav-links">
        ${DB.routes.map(r => `<a href="#/${r.id}" class="nav-link" data-route="${r.id}">${r.label}</a>`).join("")}
      </nav>
      <div class="nav-actions">
        <button class="icon-btn" id="btn-copy-link" title="Copiar enlace">🔗 Enlace</button>
      </div>
    </div></header>

    <div class="route-bar">
      <span class="route-pill" id="route-label"></span>
    </div>

    <main>
      <!-- INICIO -->
      <div class="view" id="view-inicio">
        <div class="hero" style="margin-top:14px">
          <span class="hero-badge">✨ Magia, Color y Diversión Artesanal</span>
          <h1>Haz que tu fiesta brille con <span>Piñatas Estrella</span></h1>
          <p>Creamos piñatas únicas hechas a mano con dedicación. <b>Tiempo mínimo de encargo: 2 semanas</b>.</p>
          <div class="hero-cta">
            <a href="#/tamanos" class="btn">📏 Ver Tamaños Disponibles</a>
            <a href="#/personalizador" class="btn sec">🪄 Diseña tu Piñata</a>
            <a href="#/galeria" class="btn sec">✨ Piñatas Estrella</a>
          </div>
          <div class="stats-grid">
            <div class="stat-card"><b>100%</b><span>Artesanales a medida</span></div>
            <div class="stat-card"><b>2 semanas mín.</b><span>Tiempo de elaboración</span></div>
            <div class="stat-card"><b>Exclusivas</b><span>Diseños únicos para ti</span></div>
            <div class="stat-card"><b>&lt; 24 h</b><span>Atención personalizada</span></div>
          </div>
        </div>
        <div class="container">
          <div class="sec-head"><h2>Navegación Rápida</h2><p>Elige una sección para comenzar</p></div>
          <div class="grid">
            <div class="card">
              <div><div class="emoji-box">📏</div><h3>Tamaños Disponibles</h3><p class="meta">Consulta las medidas orientativas y los plazos mínimos de 2 semanas en adelante.</p></div>
              <a href="#/tamanos" class="btn" style="margin-top:10px">Ver Tamaños →</a>
            </div>
            <div class="card">
              <div><div class="emoji-box">🪄</div><h3>Diseñador Interactivo</h3><p class="meta">Calcula el precio de mercado y los plazos exactos de elaboración.</p></div>
              <a href="#/personalizador" class="btn" style="margin-top:10px">Diseñar Ahora →</a>
            </div>
            <div class="card">
              <div><div class="emoji-box">✨</div><h3>Piñatas Estrella</h3><p class="meta">Descubre nuestra galería de creaciones reales entregadas.</p></div>
              <a href="#/galeria" class="btn" style="margin-top:10px">Ver Galería →</a>
            </div>
          </div>
        </div>
      </div>

      <!-- TAMAÑOS -->
      <div class="view" id="view-tamanos">
        <div class="container">
          <div class="sec-head">
            <h2>Tamaños Disponibles y Medidas</h2>
            <p>Todas nuestras piñatas se elaboran a mano bajo encargo. <b>El tiempo mínimo de fabricación es de 2 semanas</b>.</p>
          </div>
          <div class="grid">
            ${DB.sizesData.map(s => `
              <div class="card">
                <div>
                  <div class="emoji-box">${s.emoji}</div>
                  <h3>${s.name}</h3>
                  <p style="color: var(--accent); font-weight: 800; font-size: 0.95rem; margin: 4px 0;">📏 ${s.measure}</p>
                  <p class="meta" style="margin:8px 0">${s.desc}</p>
                </div>
                <div>
                  <p class="meta" style="color:var(--accent)">⏱️ Elaboración: ${s.time}</p>
                  <div class="price">${s.priceRef}</div>
                  <a href="#/personalizador" class="btn" style="width:100%;text-align:center;margin-top:8px">Elegir este tamaño →</a>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      </div>

      <!-- GALERÍA PIÑATAS ESTRELLA -->
      <div class="view" id="view-galeria">
        <div class="container">
          <div class="sec-head">
            <h2>✨ Piñatas Estrella</h2>
            <p>Nuestra colección de trabajos anteriores más destacados.</p>
          </div>
          <div class="grid">
            ${DB.gallery.map(g => `
              <div class="card">
                <div>
                  <div class="emoji-box">${g.emoji}</div>
                  <div style="margin:10px 0"><span class="tag" style="background:rgba(225,29,72,0.15);color:#fb7185;padding:4px 10px;border-radius:99px;font-size:.75rem;font-weight:800">${g.type} · 📏 ${g.size}</span></div>
                  <h3>${g.title}</h3>
                  <p class="meta" style="margin-top:6px">${g.imgDesc}</p>
                </div>
                <a href="#/contacto" class="btn" style="width:100%;text-align:center;margin-top:12px">Encargar una similar</a>
              </div>
            `).join("")}
          </div>
        </div>
      </div>

      <!-- PERSONALIZADOR -->
      <div class="view" id="view-personalizador">
        <div class="container">
          <div class="sec-head">
            <h2>🪄 Diseña tu Piñata a Medida</h2>
            <p>Configura los detalles de tu piñata ideal con tarifas actualizadas. Tiempo mínimo de elaboración: 2 semanas.</p>
          </div>
          <div class="split">
            <div class="panel">
              <label>Tipo de Piñata
                <select id="t-type">
                  ${DB.types.map(t => `<option value="${t.id}">${t.emoji} ${t.name} (Desde ${t.baseP}€)</option>`).join("")}
                </select>
              </label>
              <label>Tamaño deseado y medida orientativa
                <select id="t-size">
                  ${Object.keys(DB.sizes).map(s => `<option value="${s}">${s}</option>`).join("")}
                </select>
              </label>
              <label>Temática o colores personalizados
                <input id="t-custom" placeholder="Ej: Colores pasteles, temática de princesas, etc.">
              </label>
              <label>Cantidad de unidades
                <input id="t-cant" type="number" min="1" value="1">
              </label>
            </div>
            <div class="panel">
              <h3>Resumen de tu Diseño</h3>
              <div class="est-box">
                <span>Precio Estimado</span>
                <b id="t-price">0 €</b>
                <span class="time-badge" id="t-time">⏱️ Tiempo mínimo: 2 semanas</span>
              </div>
              <button type="button" class="btn" id="t-use" style="width:100%">Enviar diseño a #/contacto →</button>
            </div>
          </div>
        </div>
      </div>

      <!-- CONTACTO / ENCARGAR -->
      <div class="view" id="view-contacto">
        <div class="container">
          <div class="sec-head">
            <h2>💌 Encargar tu Piñata</h2>
            <p>Completa el formulario (ten en cuenta el plazo mínimo de 2 semanas de antelación).</p>
          </div>
          <div class="panel" style="max-width:680px;margin:auto">
            <form id="form" action="https://api.web3forms.com/submit" method="POST" style="display:flex;flex-direction:column;gap:16px">
              <input type="hidden" name="access_key" value="${DB.web3Key}">
              <input type="hidden" name="subject" id="f-subject" value="Nuevo encargo en Piñatas Estrella">
              <input type="hidden" name="from_name" value="${DB.brand}">
              <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">

              <div class="row">
                <label>Motivo del contacto
                  <select id="operacion" name="Operacion" required>
                    <option value="Encargo de piñata personalizada">Encargo de piñata</option>
                    <option value="Consulta sobre diseño o tiempos">Consulta general</option>
                  </select>
                </label>
                <label>Fecha de tu evento (Mínimo 2 semanas)
                  <input name="Fecha_Evento" type="date" required>
                </label>
              </div>

              <label>Detalle del pedido o diseño
                <input id="articulo" name="Detalle_Encargo" placeholder="Diseñada a medida..." required>
              </label>

              <div class="row">
                <label>Cantidad
                  <input id="cantidad" name="Cantidad" type="number" min="1" value="1">
                </label>
                <label>Presupuesto orientativo (€)
                  <input id="precio" name="Presupuesto_EUR" type="number" min="0" placeholder="Opcional">
                </label>
              </div>

              <label>Materiales y Acabados especiales (Opcional)
                <select name="Materiales_Extras">
                  <option value="Estándar (Papel china / crepé tradicional)">Estándar (Papel china / crepé tradicional)</option>
                  <option value="Papel metalizado / brillante especial">Papel metalizado / brillante especial</option>
                  <option value="Estructura reforzada extra resistente">Estructura reforzada extra resistente</option>
                  <option value="Incluir kit sorpresa (confeti y golosinas)">Incluir kit sorpresa (confeti y golosinas)</option>
                </select>
              </label>

              <div class="row">
                <label>Tu nombre
                  <input name="Nombre" placeholder="Nombre completo" required>
                </label>
                <label>Zona / Ciudad
                  <input name="Ubicacion" placeholder="Ej: Madrid" required>
                </label>
              </div>

              <div class="row">
                <label>Correo electrónico
                  <input name="email" type="email" placeholder="tu@correo.com" required>
                </label>
                <label>Teléfono o WhatsApp
                  <input name="Telefono" type="tel" placeholder="600 000 000" required>
                </label>
              </div>

              <label>Cuéntanos los detalles, colores y temática deseada
                <textarea id="mensaje" name="Mensaje" rows="4" placeholder="Describe cómo imaginas la piñata perfecta..." required></textarea>
              </label>

              <button class="btn" id="send" type="submit">✨ Enviar pedido a Piñatas Estrella</button>
            </form>
          </div>
        </div>
      </div>

      <!-- FAQ -->
      <div class="view" id="view-faq">
        <div class="container">
          <div class="sec-head"><h2>Preguntas Frecuentes</h2><p>Todo lo que necesitas saber para tu encargo</p></div>
          <div style="max-width:740px;margin:auto">
            ${DB.faqs.map(f => `<details><summary>${f.q}</summary><p>${f.a}</p></details>`).join("")}
          </div>
        </div>
      </div>
    </main>

    <footer><p>© ${new Date().getFullYear()} <span>Piñatas Estrella</span> · Hecho a mano con ilusión para tus mejores momentos</p></footer>
  `;
}

function calcDesigner() {
  const typeObj = DB.types.find(t => t.id === $("t-type").value) || DB.types[0];
  const sizeKey = $("t-size").value;
  const sizeObj = DB.sizes[sizeKey] || DB.sizes["Mediana (60 cm)"];
  const qty = Math.max(1, +$("t-cant").value || 1);

  const finalP = Math.round(typeObj.baseP * sizeObj.mult * qty);
  $("t-price").textContent = `${finalP} €`;
  $("t-time").textContent = `⏱️ Tiempo mínimo: ${sizeObj.time}`;
}

initApp();
calcDesigner();
window.addEventListener("hashchange", syncRoute);
syncRoute();

$("btn-copy-link").onclick = () => {
  navigator.clipboard.writeText(location.href);
  notify(`🔗 Enlace copiado: ${location.hash}`);
};

["t-type", "t-size", "t-cant"].forEach(id => $(id).addEventListener("input", calcDesigner));

$("t-use").onclick = () => {
  const typeObj = DB.types.find(t => t.id === $("t-type").value);
  const sizeKey = $("t-size").value;
  const sizeObj = DB.sizes[sizeKey];
  const qty = Math.max(1, +$("t-cant").value || 1);
  const custom = $("t-custom").value.trim();

  $("operacion").value = "Encargo de piñata personalizada";
  $("articulo").value = `${typeObj.name} - Tamaño ${sizeKey} (${qty} ud)`;
  $("cantidad").value = qty;
  $("precio").value = Math.round(typeObj.baseP * sizeObj.mult * qty);
  $("mensaje").value = `Diseño personalizado desde la web:\n- Estilo: ${typeObj.name}\n- Tamaño: ${sizeKey}\n- Tiempo estimado: ${sizeObj.time}\n- Detalles: ${custom || "Ninguno"}`;
  location.hash = "#/contacto";
  notify("📋 ¡Diseño transferido al formulario!");
};

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("send");
  btn.disabled = true; btn.textContent = "⏳ Enviando pedido...";
  $("f-subject").value = `${$("operacion").value}: ${$("articulo").value}`;
  try {
    const r = await fetch(e.target.action, { method: "POST", headers: { Accept: "application/json" }, body: new FormData(e.target) });
    const d = await r.json();
    if (d.success) {
      notify("✨ ¡Pedido enviado con éxito! Te contactaremos pronto.");
      e.target.reset();
    } else throw new Error();
  } catch (_) {
    notify("❌ Error al enviar. Inténtalo de nuevo.");
  }
  btn.disabled = false; btn.textContent = "✨ Enviar pedido a Piñatas Estrella";
});
</script>
</body>
</html>
